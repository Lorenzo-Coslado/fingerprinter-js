<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="208" viewBox="0 0 1000 208" role="img" aria-labelledby="title desc">
  <title id="title">How FingerprinterJS builds a browser signature</title>
  <desc id="desc">Read selected observations, project explicitly stable fields, serialize canonically and hash with SHA-256, then return versioned results and diagnostics. Context and volatile observations remain outside the hash.</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fafafa}.box{fill:#fff;stroke:#d4d4d8}.line{stroke:#a1a1aa;fill:none}.title{fill:#18181b;font:600 15px system-ui,sans-serif}.sub{fill:#52525b;font:12px system-ui,sans-serif}.small{fill:#71717a;font:11px system-ui,sans-serif}.dot{fill:#18181b;animation:travel 7s ease-in-out infinite}@keyframes travel{0%,8%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}96%,100%{transform:translateX(750px);opacity:0}}@media(prefers-color-scheme:dark){.bg{fill:#09090b}.box{fill:#18181b;stroke:#3f3f46}.title{fill:#fafafa}.sub,.small{fill:#a1a1aa}.dot{fill:#fafafa}}@media(prefers-reduced-motion:reduce){.dot{display:none}}
  </style>
  <rect class="bg" width="1000" height="208" rx="12"/>
  <path class="line" d="M 129 88 H 873" stroke-dasharray="4 5"/>
  <circle class="dot" cx="123" cy="88" r="3"/>
  <g transform="translate(28 38)"><rect class="box" width="210" height="100" rx="8"/><text class="small" x="16" y="25">01 / OBSERVE</text><text class="title" x="16" y="51">Selected browser signals</text><text class="sub" x="16" y="76">Explicit call. Bounded collection.</text></g>
  <g transform="translate(273 38)"><rect class="box" width="210" height="100" rx="8"/><text class="small" x="16" y="25">02 / PROJECT</text><text class="title" x="16" y="51">Stable fields only</text><text class="sub" x="16" y="76">A versioned identification policy.</text></g>
  <g transform="translate(518 38)"><rect class="box" width="210" height="100" rx="8"/><text class="small" x="16" y="25">03 / HASH</text><text class="title" x="16" y="51">Canonical JSON + SHA-256</text><text class="sub" x="16" y="76">Same normalized input, same hash.</text></g>
  <g transform="translate(763 38)"><rect class="box" width="210" height="100" rx="8"/><text class="small" x="16" y="25">04 / INSPECT</text><text class="title" x="16" y="51">Signature + diagnostics</text><text class="sub" x="16" y="76">States, durations and differences.</text></g>
  <text class="small" x="500" y="176" text-anchor="middle">Context and volatile observations stay outside the fingerprint. A signature does not prove identity.</text>
</svg>
